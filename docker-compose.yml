name: star-store

version: "3.9"

services:
  # ==========================================================
  # MYSQL BUSINESS DATABASE
  # ==========================================================
  mysql:
    image: mysql:8.0
    container_name: star-mysql-container
    restart: unless-stopped

    env_file:
      - .env

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - star_mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - star-data-network

  # ==========================================================
  # FASTAPI BACKEND
  # ==========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: star-ecommerce-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

    env_file:
      - .env

    ports:
      - "8001:8000"

    volumes:
      - ./backend:/app

    working_dir: /app

    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

    networks:
      - star-data-network
   # ==========================================================
  # DATA LOADER (RUN ONCE)
  # ==========================================================
  loader:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: star-data-loader

    depends_on:
      mysql:
        condition: service_healthy

    env_file:
      - .env

    volumes:
      - ./backend:/app

    working_dir: /app

    command: ["python", "quick_load.py"]

    networks:
      - star-data-network

  # ==========================================================
  # AIRFLOW POSTGRES DATABASE
  # ==========================================================
  postgres:
    image: postgres:15
    container_name: star-airflow-postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - star_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - star-data-network

  # ==========================================================
  # ZOOKEEPER
  # ==========================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: star-zookeeper
    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    networks:
      - star-data-network

  # ==========================================================
  # KAFKA
  # ==========================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: star-kafka
    restart: unless-stopped

    depends_on:
      - zookeeper

    ports:
      - "9093:9092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

    networks:
      - star-data-network

  # ==========================================================
  # AIRFLOW INIT
  # ==========================================================
  airflow-init:
    image: apache/airflow:2.10.5
    container_name: star-airflow-init

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_UID: ${AIRFLOW_UID}

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username ${AIRFLOW_USER}
      --firstname Admin
      --lastname User
      --role Admin
      --email ${AIRFLOW_EMAIL}
      --password ${AIRFLOW_PASSWORD}
      || true
      "

    networks:
      - star-data-network

  # ==========================================================
  # AIRFLOW WEBSERVER
  # ==========================================================
  airflow-webserver:
    image: apache/airflow:2.10.5
    container_name: star-airflow-webserver
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    env_file:
      - .env

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_UID: ${AIRFLOW_UID}

    ports:
      - "8081:8080"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins

    command: ["airflow", "webserver"]

    networks:
      - star-data-network

  # ==========================================================
  # AIRFLOW SCHEDULER
  # ==========================================================
  airflow-scheduler:
    image: apache/airflow:2.10.5
    container_name: star-airflow-scheduler
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    env_file:
      - .env

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_UID: ${AIRFLOW_UID}

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins

    command: ["airflow", "scheduler"]

    networks:
      - star-data-network

# ==========================================================
# VOLUMES
# ==========================================================
volumes:
  star_mysql_data:
  star_postgres_data:

# ==========================================================
# NETWORK
# ==========================================================
networks:
  star-data-network:
    driver: bridge